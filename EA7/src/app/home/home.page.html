<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>OpenAi</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon> Cerrar Sesión
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">OpenAi</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <h1>Bienvenido a tu propia IA</h1>
    <p>Empieza una conversación</p>
  </div>

  <ion-item>
    <ion-label position="floating">Ingresa tu idea</ion-label>
    <br>
    <ion-input [(ngModel)]="ideaPrompt" placeholder="Por ejemplo, genera ideas para un startup de tecnología"></ion-input>
  </ion-item>

  <ion-button expand="full" (click)="generateIdea()">Generar idea</ion-button>

  <ion-card *ngIf="generatedIdea">
    <ion-card-header>
      <ion-card-title>Idea generada</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      {{ generatedIdea }}
    </ion-card-content>
  </ion-card>
</ion-content>
