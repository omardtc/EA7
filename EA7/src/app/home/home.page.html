<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Gestión de Tareas</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon> Cerrar Sesión
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Gestión de Tareas</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <h1>Agregar Nueva Tarea</h1>
  </div>

  <ion-item>
    <ion-label position="floating">Título de la tarea</ion-label>
    <ion-input [(ngModel)]="taskTitle" placeholder="Ejemplo: Comprar suministros"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Descripción</ion-label>
    <ion-textarea [(ngModel)]="taskDescription" placeholder="Ejemplo: Comprar papel y tinta para la impresora"></ion-textarea>
  </ion-item>

  <ion-button expand="full" (click)="addTask()">Agregar Tarea</ion-button>

  <h2>Tareas Pendientes</h2>
  <ion-list>
    <ion-item *ngFor="let task of taskList$ | async">
      <ion-label>
        <h3>{{ task.title }}</h3>
        <p>{{ task.description }}</p>
      </ion-label>
      <ion-button color="danger" (click)="deleteTask(task.id!)">
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>      
    </ion-item>
  </ion-list>
</ion-content>
